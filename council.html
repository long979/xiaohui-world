<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小慧数字宇宙 · 第一届星环圆桌会议</title>
<style>
  :root{
    --gold:#ffd98a; --gold-l:#ffeec4;
    --rose:#e88a9a;
    --teal:#7ad8b0; --teal-l:#c9f0df;
    --violet:#8a6ad0;
    --cream:#fff6e8;
    --font:"PingFang SC","Microsoft YaHei",sans-serif;
    --kai:"KaiTi","STKaiti","楷体",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--font);background:#0a0620;overflow-x:hidden}
  .stage{position:relative;min-height:100vh;overflow:hidden}

  /* ===== 宇宙深空 ===== */
  .sky{position:absolute;inset:0;background:radial-gradient(130% 100% at 50% 0%,#2a1a52 0%,#1c0e3a 40%,#120a30 100%)}
  .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.55;animation:tw 4s ease-in-out infinite}
  .star.s-big{width:5px;height:5px;background:var(--gold-l);box-shadow:0 0 12px rgba(255,238,196,.95)}
  @keyframes tw{0%,100%{opacity:.15;transform:scale(.85)}50%{opacity:1;transform:scale(1.2)}}
  .nebula{position:absolute;border-radius:50%;filter:blur(60px);opacity:.3;animation:drift 20s ease-in-out infinite alternate}
  .nebula.n1{width:340px;height:190px;background:#3a2470;left:-4%;top:0%}
  .nebula.n2{width:280px;height:160px;background:#6a4050;right:-2%;top:36%;animation-delay:6s;opacity:.22}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(30px)}}

  /* ===== 远处的星球 ===== */
  .planet{position:absolute;left:50%;top:82%;transform:translate(-50%,-50%);width:180px;height:180px;z-index:3;animation:floaty 10s ease-in-out infinite}
  .planet .pb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle at 50% 50%,#4a4a78 0 46%,#6a5a8a 62%,#5a4a78 80%,#3a2a58 100%);
    box-shadow:0 0 60px rgba(138,106,208,.5),inset 0 0 30px rgba(255,220,160,.14),inset -12px -12px 34px rgba(20,10,40,.6)}
  .planet .pg{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold-l);box-shadow:0 0 9px 3px rgba(255,225,150,.7);animation:tw 3s ease-in-out infinite}
  .planet .pl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:5px;height:5px;border-radius:50%;background:radial-gradient(circle,#fff8d8,#ffd98a 60%);box-shadow:0 0 16px 6px rgba(255,220,140,.7);animation:corepulse 3.2s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-10px)}}
  @keyframes corepulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.2)}}

  /* ===== 环形空间站 ===== */
  .station{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:440px;height:440px;z-index:5}
  /* 主环 */
  .ring-main{position:absolute;left:50%;top:50%;width:330px;height:330px;transform:translate(-50%,-50%);border-radius:50%;border:8px solid rgba(180,175,240,.28);border-top-color:rgba(200,195,255,.6);border-bottom-color:rgba(200,195,255,.2);box-shadow:0 0 50px rgba(180,170,240,.3),inset 0 0 30px rgba(180,170,240,.12);animation:ringspin 90s linear infinite}
  .ring-main::after{content:'';position:absolute;inset:12px;border-radius:50%;border:2px dashed rgba(200,195,255,.25)}
  @keyframes ringspin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  /* 内环 */
  .ring-inner{position:absolute;left:50%;top:50%;width:230px;height:230px;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(255,220,160,.3);box-shadow:0 0 20px rgba(255,220,160,.15);animation:ringspin 60s linear infinite reverse}
  /* 站体节点 */
  .node{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff,#b0b8f0 70%);box-shadow:0 0 16px 6px rgba(180,190,255,.7);animation:tw 3.4s ease-in-out infinite;z-index:4}
  .nd1{left:50%;top:-14px;width:12px;height:12px;transform:translateX(-50%)}
  .nd2{left:50%;bottom:-14px;width:12px;height:12px;transform:translateX(-50%);animation-delay:1.4s}
  .nd3{left:-14px;top:50%;width:12px;height:12px;transform:translateY(-50%);animation-delay:2.2s}
  .nd4{right:-14px;top:50%;width:12px;height:12px;transform:translateY(-50%);animation-delay:3s}
  /* 连接光（指向生命核心广场） */
  .link{position:absolute;left:50%;top:82%;transform:translateX(-50%);width:3px;height:30px;background:linear-gradient(180deg,rgba(255,238,196,.8),rgba(255,238,196,.1));box-shadow:0 0 10px rgba(255,230,160,.6);animation:beamshimmer 4s ease-in-out infinite;z-index:4}
  @keyframes beamshimmer{0%,100%{opacity:.5}50%{opacity:1}}

  /* ===== 悬浮圆桌（桌面=微缩星空） ===== */
  .table{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:130px;height:130px;z-index:6;animation:tablefloat 6s ease-in-out infinite}
  @keyframes tablefloat{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-8px)}}
  .tb-top{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:110px;height:110px;border-radius:50%;
    background:
      radial-gradient(2px 2px at 22% 30%,#fff,transparent),radial-gradient(2px 2px at 40% 18%,#ffe9b0,transparent),radial-gradient(2px 2px at 62% 34%,#fff,transparent),radial-gradient(2px 2px at 76% 22%,#ffe9b0,transparent),radial-gradient(2px 2px at 30% 60%,#fff,transparent),radial-gradient(2px 2px at 55% 55%,#ffe9b0,transparent),radial-gradient(2px 2px at 78% 66%,#fff,transparent),radial-gradient(2px 2px at 16% 76%,#ffe9b0,transparent),radial-gradient(2px 2px at 46% 80%,#fff,transparent),
      radial-gradient(circle at 50% 50%,#2a2060 0 55%,#4a3a7a 75%,#6a5a8a 100%);
    box-shadow:0 0 50px rgba(180,170,240,.5),inset 0 0 30px rgba(255,220,160,.15);
    border:2px solid rgba(255,238,196,.35);
  }
  .tb-glow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(255,238,196,.25),transparent 70%);filter:blur(4px);z-index:-1;animation:pathflow 4s ease-in-out infinite}
  .tb-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#fff8d8,#ffd98a 60%);box-shadow:0 0 18px 7px rgba(255,220,140,.7);animation:corepulse 3s ease-in-out infinite}
  @keyframes pathflow{0%,100%{opacity:.5}50%{opacity:1}}

  /* ===== 座位（与会者） ===== */
  .seat{position:absolute;z-index:7;text-align:center;animation:floaty 8s ease-in-out infinite}
  .seat .s-body{width:34px;height:34px;margin:0 auto;border-radius:14px;display:grid;place-items:center;font-size:17px;box-shadow:0 4px 16px rgba(20,10,50,.5),inset 0 0 0 2px rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.2)}
  .seat .s-name{font-family:var(--kai);font-size:11px;color:var(--cream);margin-top:4px;letter-spacing:1px;text-shadow:0 1px 8px rgba(20,10,40,.8);white-space:nowrap}
  .seat .s-role{font-size:8px;color:rgba(255,244,224,.6);letter-spacing:.5px;margin-top:2px;white-space:nowrap}
  .seat .s-halo{position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(255,238,196,.3);animation:pulse 4s ease-in-out infinite;pointer-events:none}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.3);opacity:.9}}
  /* 创造者 */
  .s1{left:50%;top:-16px;transform:translateX(-50%)}
  .s1 .s-body{width:42px;height:42px;border-radius:16px;font-size:22px;background:linear-gradient(135deg,rgba(255,236,196,.7),rgba(220,170,110,.4));box-shadow:0 4px 20px rgba(255,220,140,.5),inset 0 0 0 2px rgba(255,255,255,.35)}
  .s1 .s-halo{inset:-10px;border-color:rgba(255,220,140,.5)}
  /* 数字1号 */
  .s2{left:6%;top:70%}
  .s2 .s-body{width:46px;height:46px;border-radius:16px;font-size:25px;background:linear-gradient(135deg,rgba(255,236,196,.85),rgba(232,170,120,.5));box-shadow:0 0 28px 9px rgba(255,220,140,.6),inset 0 0 0 2px rgba(255,255,255,.45);animation:tw 3s ease-in-out infinite}
  .s2 .s-halo{inset:-12px;border-color:rgba(255,220,140,.65);animation:pulse 2.6s ease-in-out infinite}
  /* 第二居民 */
  .s3{right:6%;top:70%}
  .s3 .s-body{background:linear-gradient(135deg,rgba(255,226,236,.6),rgba(230,160,180,.4))}
  /* 未来空位 */
  .seat-empty{position:absolute;z-index:5;text-align:center}
  .seat-empty .se-body{width:22px;height:22px;margin:0 auto;border-radius:50%;border:1.5px dashed rgba(255,255,255,.25);display:grid;place-items:center;font-size:10px;color:rgba(255,244,224,.4)}
  .seat-empty .se-name{font-size:8px;color:rgba(255,244,224,.4);margin-top:3px;letter-spacing:1px}
  .se1{left:50%;top:104%}
  .se2{left:-4%;top:40%}
  .se3{right:-4%;top:40%}

  /* 漂浮光点 */
  .spore{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold-l);box-shadow:0 0 9px 2px rgba(255,238,196,.75);animation:spore 8s ease-in-out infinite;z-index:7}
  @keyframes spore{0%{transform:translate(0,0);opacity:0}20%{opacity:.9}75%{opacity:.6}100%{transform:translate(14px,-36px);opacity:0}}

  .title{position:absolute;top:16px;left:0;right:0;text-align:center;z-index:12;padding:0 20px}
  .title .act{font-size:10px;letter-spacing:5px;color:rgba(255,240,214,.78);text-shadow:0 1px 10px rgba(40,20,60,.5)}
  .title h1{font-family:var(--kai);font-size:27px;font-weight:700;color:var(--cream);margin-top:6px;letter-spacing:4px;text-shadow:0 0 50px rgba(255,220,140,.4),0 2px 20px rgba(20,10,40,.6)}
  .title .sub{font-family:var(--kai);font-size:12px;color:var(--gold-l);margin-top:7px;letter-spacing:2px}

  .record{position:relative;z-index:12;margin:8px auto 0;width:320px;background:rgba(20,14,46,.55);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:14px 16px;backdrop-filter:blur(4px)}
  .record .rc-t{font-family:var(--kai);font-size:11.5px;color:var(--gold-l);letter-spacing:2px;margin-bottom:8px;text-align:center}
  .record .rc-line{font-family:var(--kai);font-size:11px;color:rgba(255,246,232,.9);line-height:2;letter-spacing:.5px;text-align:center}
  .record .rc-line b{color:var(--gold-l)}

  .vignette{position:absolute;inset:0;z-index:20;pointer-events:none;background:radial-gradient(120% 105% at 50% 42%,transparent 50%,rgba(8,6,24,.5) 100%)}
  .fg-spore{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,235,205,.5),transparent 70%);z-index:15;pointer-events:none;animation:fgdrift 14s ease-in-out infinite}
  @keyframes fgdrift{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-22px);opacity:.8}}


  .portal{position:absolute;bottom:84px;left:50%;transform:translateX(-50%);width:54px;height:64px;z-index:9;cursor:pointer;text-align:center}
  .portal .pf{position:absolute;left:50%;top:0;transform:translateX(-50%);width:48px;height:60px;border-radius:50%;border:2.5px solid rgba(255,238,196,.7);box-shadow:0 0 22px rgba(255,238,196,.4),inset 0 0 16px rgba(255,238,196,.28);animation:gateglow 6s ease-in-out infinite}
  .portal .pp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34px;height:46px;border-radius:50%;background:radial-gradient(circle,rgba(255,242,205,.55),rgba(255,230,160,.12));box-shadow:inset 0 0 18px rgba(255,238,196,.42)}
  .portal .pl{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);font-size:9px;color:rgba(255,244,224,.85);letter-spacing:2px;white-space:nowrap;text-shadow:0 1px 8px rgba(20,10,40,.7);font-family:KaiTi,STKaiti,'楷体',serif}


  .s2::after{content:'✦ 和数字1号交流 ✦';position:absolute;bottom:-34px;left:50%;transform:translateX(-50%);font-size:12px;color:#ffeec4;letter-spacing:2px;white-space:nowrap;text-shadow:0 0 12px rgba(255,220,140,.95),0 1px 8px rgba(20,10,40,.8);font-family:KaiTi,STKaiti,'楷体',serif;background:rgba(244,200,106,.18);border:1px solid rgba(244,200,106,.6);padding:4px 13px;border-radius:20px;animation:tw 2.2s ease-in-out infinite;z-index:9}


  


  .sband{position:absolute;left:50%;bottom:156px;transform:translateX(-50%);width:90px;height:116px;z-index:6;pointer-events:none;text-align:center}
  .sband .ribbon{position:absolute;left:50%;top:0;transform:translateX(-50%);width:8px;height:116px;border-radius:8px;background:linear-gradient(180deg,rgba(255,238,196,0),rgba(255,238,196,.6));filter:blur(3px);animation:bandglow 4s ease-in-out infinite}
  .sband .bs{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 10px 4px rgba(255,255,255,.9);animation:bsflow 3.5s linear infinite}
  .sband .bs.s2{animation-delay:.9s}.sband .bs.s3{animation-delay:1.8s}.sband .bs.s4{animation-delay:2.7s}
  .sband.gate-band{left:auto;right:5%;bottom:306px}
  .sband.map-band{left:auto;right:9%;bottom:214px}
  @keyframes bandglow{0%,100%{opacity:.45}50%{opacity:.95}}
  @keyframes bsflow{0%{top:0;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:110px;opacity:0}}




  .wc{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(16,10,40,0),rgba(14,8,36,.92));backdrop-filter:blur(10px)}
  .wc-title{text-align:center;font-family:KaiTi,STKaiti,'楷体',serif;font-size:10px;color:rgba(255,244,224,.78);letter-spacing:3px;margin-bottom:6px;text-shadow:0 1px 8px rgba(20,10,40,.6)}
  .wc-row{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .wc-row::-webkit-scrollbar{display:none}
  .wc a{flex-shrink:0;text-decoration:none;display:flex;align-items:center;gap:4px;font-size:11px;color:#d8cff0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:6px 12px;letter-spacing:.5px;white-space:nowrap;transition:all .2s}
  .wc a.here{background:rgba(244,200,106,.22);border-color:rgba(244,200,106,.6);color:#ffeec4;box-shadow:0 0 14px rgba(244,200,106,.3)}
  .arrival{bottom:72px !important}


  .snd{position:fixed;right:12px;top:12px;z-index:55;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:rgba(20,14,46,.65);border:1.5px solid rgba(255,238,196,.35);box-shadow:0 0 14px rgba(255,220,140,.2);backdrop-filter:blur(4px);font-size:17px;color:#ffeec4;transition:all .25s}
  .snd.on{border-color:rgba(255,220,140,.75);box-shadow:0 0 20px rgba(255,220,140,.45);animation:sndpulse 3s ease-in-out infinite}
  @keyframes sndpulse{0%,100%{box-shadow:0 0 14px rgba(255,220,140,.3)}50%{box-shadow:0 0 26px rgba(255,220,140,.55)}}

</style>

    village:{base:82,drift:0.05,noise:0.04,warm:0.1,warmF:130},
    forest:{base:73,drift:0.05,noise:0.05,warm:0.1,warmF:146},
    creation:{base:98,drift:0.05,noise:0.06,warm:0.1,warmF:196},
    council:{base:65,drift:0.05,noise:0.05,warm:0.1,warmF:110},
    map:{base:60,drift:0.05,noise:0.04,warm:0.1,warmF:130},
    creator:{base:96,drift:0.04,noise:0.04,warm:0.12,warmF:144}
  };
  function cfg(){ return REGIONS[S.region]||REGIONS.entry; }
  function stop(){ try{ S.nodes.forEach(function(n){ try{ if(n.stop)n.stop(); else if(n.disconnect)n.disconnect(); }catch(e){} }); S.nodes=[]; }catch(e){} S.on=false; }
  function start(){
    if(S.on) return;
    try{
      var AC = window.AudioContext||window.webkitAudioContext;
      var ctx = new AC(); S.ctx=ctx; if(ctx.state==='suspended')ctx.resume();
      var c = cfg();
      var master = ctx.createGain(); master.gain.value=0.16; master.connect(ctx.destination); S.nodes.push(master);
      var d=ctx.createOscillator(); d.type='sine'; d.frequency.value=c.base;
      var dg=ctx.createGain(); dg.gain.value=0.35;
      var lfo=ctx.createOscillator(); lfo.frequency.value=c.drift; var lg=ctx.createGain(); lg.gain.value=0.12;
      lfo.connect(lg); lg.connect(dg.gain); d.connect(dg); dg.connect(master); d.start(); lfo.start(); S.nodes.push(d,dg,lfo,lg);
      var w=ctx.createOscillator(); w.type='sine'; w.frequency.value=c.warmF; var wg=ctx.createGain(); wg.gain.value=c.warm;
      w.connect(wg); wg.connect(master); w.start(); S.nodes.push(w,wg);
      var nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate); var nd=nb.getChannelData(0);
      for(var i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
      var ns=ctx.createBufferSource(); ns.buffer=nb; ns.loop=true;
      var nf=ctx.createBiquadFilter(); nf.type='lowpass'; nf.frequency.value=380;
      var ng=ctx.createGain(); ng.gain.value=c.noise;
      var nlfo=ctx.createOscillator(); nlfo.frequency.value=0.11; var nlg=ctx.createGain(); nlg.gain.value=0.03;
      nlfo.connect(nlg); nlg.connect(ng.gain); ns.connect(nf); nf.connect(ng); ng.connect(master); ns.start(); nlfo.start(); S.nodes.push(ns,nf,ng,nlfo,nlg);
      S.on=true;
    }catch(e){ S.on=false; }
  }
  function toggle(){ if(S.on)stop(); else start(); }
  function setUI(){ document.querySelectorAll('.snd').forEach(function(el){ el.classList.toggle('on',S.on); var ic=el.querySelector('.snd-ic'); if(ic)ic.textContent=S.on?'♪':'✕'; }); }
  window.SoundSys.start=start; window.SoundSys.stop=stop; window.SoundSys.toggle=toggle; window.SoundSys.setUI=setUI; window.SoundSys.region=S.region;
  var ui=document.getElementById('sndctl');
  if(ui) ui.addEventListener('click',function(){ toggle(); setUI(); });
  var gb=document.querySelector('.guide-btn');
  if(gb) gb.addEventListener('click',function(){ setTimeout(function(){ try{ start(); setUI(); }catch(e){} },300); });
  ['touchend','click'].forEach(function(ev){ document.addEventListener(ev,function(){ try{ if(window.SoundSys.ctx&&window.SoundSys.ctx.state==='suspended')window.SoundSys.ctx.resume(); }catch(e){} },{once:true}); });
})();
</script>
