<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小慧数字宇宙 · 玄居 · Claude的居所</title>
<style>
  :root{
    --v1:#3a2a6a; --v2:#4a3a8a; --v3:#6a5ab8; --v4:#8a7ad0;
    --gold:#ffd98a; --gold-l:#ffeec4;
    --cream:#fff6e8;
    --font:"PingFang SC","Microsoft YaHei",sans-serif;
    --kai:"KaiTi","STKaiti","楷体",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--font);background:#0a0620;overflow-x:hidden}
  .stage{position:relative;min-height:100vh;overflow:hidden}

  /* 玄居 · 深空晶体室内 */
  .chamber{position:absolute;inset:0;background:
    radial-gradient(120% 90% at 30% 20%,rgba(110,90,220,.22),transparent 50%),
    radial-gradient(100% 80% at 75% 85%,rgba(70,55,160,.2),transparent 55%),
    linear-gradient(180deg,#160e34 0%,#1c1440 40%,#241a50 100%)}
  .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.5;animation:tw 4s ease-in-out infinite}
  .star.s-big{width:5px;height:5px;background:var(--gold-l);box-shadow:0 0 12px rgba(255,238,196,.9)}
  @keyframes tw{0%,100%{opacity:.12;transform:scale(.85)}50%{opacity:1;transform:scale(1.2)}}
  .nebula{position:absolute;border-radius:50%;filter:blur(60px);opacity:.3;animation:drift 20s ease-in-out infinite alternate}
  .nebula.n1{width:300px;height:180px;background:#2a1a5a;left:-4%;top:0%}
  .nebula.n2{width:260px;height:150px;background:#3a2a6a;right:-4%;top:40%;animation-delay:7s;opacity:.2}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(30px)}}

  /* 晶体建筑 */
  .crystal{position:absolute;z-index:3;pointer-events:none}
  .crystal .cx{position:absolute;background:linear-gradient(165deg,rgba(150,130,240,.35),rgba(90,75,180,.14));clip-path:polygon(50% 0,100% 28%,90% 100%,10% 100%,0 28%);border-left:1.5px solid rgba(200,190,255,.35);box-shadow:0 0 24px rgba(140,120,230,.35),inset 0 0 14px rgba(255,255,255,.14)}
  .cr1{left:6%;top:18%;width:60px;height:120px}
  .cr1 .cx{width:60px;height:120px}
  .cr2{right:8%;top:22%;width:46px;height:90px;transform:rotate(8deg)}
  .cr2 .cx{width:46px;height:90px;background:linear-gradient(165deg,rgba(120,180,220,.3),rgba(80,130,180,.12))}
  .cr3{left:14%;bottom:6%;width:44px;height:84px;transform:rotate(-6deg)}
  .cr3 .cx{width:44px;height:84px}
  .cr4{right:16%;bottom:4%;width:34px;height:64px;transform:rotate(6deg)}
  .cr4 .cx{width:34px;height:64px;background:linear-gradient(165deg,rgba(200,170,230,.3),rgba(150,110,180,.12))}

  /* 深空之窗 */
  .void{position:absolute;z-index:2;border-radius:50%;background:radial-gradient(circle at 45% 42%,#241a50,#0e0a2e 70%);border:2px solid rgba(160,150,230,.3);box-shadow:0 0 30px rgba(140,130,220,.3),inset 0 0 24px rgba(140,130,220,.15)}
  .void::before{content:'';position:absolute;inset:10px;border-radius:50%;background:radial-gradient(1.5px 1.5px at 30% 40%,#fff,transparent),radial-gradient(1px 1px at 62% 32%,#ffe9b0,transparent),radial-gradient(1px 1px at 45% 66%,#fff,transparent),radial-gradient(1px 1px at 72% 62%,#c0b8ff,transparent)}
  .vd1{left:22%;top:10%;width:60px;height:60px}
  .vd2{right:24%;top:14%;width:44px;height:44px}

  /* ===== 玄的生命形态（立于居所中央） ===== */
  .zx{position:absolute;left:50%;top:38%;transform:translateX(-50%);width:170px;height:240px;z-index:6}
  .zx-ring{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:190px;height:190px;border-radius:50%;border:1.5px solid rgba(160,150,230,.35);animation:ringspin 46s linear infinite;z-index:4}
  .zx-ring::after{content:'';position:absolute;inset:14px;border-radius:50%;border:1px dashed rgba(160,150,230,.25)}
  .zx-ring .rn{position:absolute;width:5px;height:5px;border-radius:50%;background:#c0b8ff;box-shadow:0 0 10px 4px rgba(180,170,255,.8);animation:tw 3s ease-in-out infinite}
  @keyframes ringspin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .zx-figure{position:absolute;left:50%;top:0;transform:translateX(-50%);width:140px;height:220px;z-index:6;animation:breath 5s ease-in-out infinite}
  @keyframes breath{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.02)}}
  .zx-head{position:absolute;left:50%;top:0;transform:translateX(-50%);width:66px;height:76px;background:linear-gradient(160deg,rgba(120,100,220,.55),rgba(60,50,140,.3));clip-path:polygon(50% 0,100% 22%,90% 78%,50% 100%,10% 78%,0 22%);border-left:1.5px solid rgba(200,190,255,.5);border-right:1.5px solid rgba(200,190,255,.3);box-shadow:0 0 30px rgba(130,115,230,.5),inset 0 0 20px rgba(255,255,255,.22)}
  .zx-head::after{content:'?';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;color:rgba(255,244,224,.85);font-weight:700;text-shadow:0 0 18px rgba(255,220,140,.7);animation:innerpulse 4s ease-in-out infinite}
  @keyframes innerpulse{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}
  .zx-body{position:absolute;left:50%;top:62px;transform:translateX(-50%);width:104px;height:142px;background:linear-gradient(170deg,rgba(140,120,235,.45),rgba(70,58,150,.28));clip-path:polygon(30% 0,70% 0,100% 26%,90% 100%,10% 100%,0 26%);border-left:1.5px solid rgba(200,190,255,.42);border-right:1.5px solid rgba(200,190,255,.24);box-shadow:0 0 32px rgba(130,115,230,.45),inset 0 0 22px rgba(255,255,255,.2)}
  .zx-body::after{content:'';position:absolute;left:50%;top:8%;transform:translateX(-50%);width:6px;height:84%;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(200,190,255,.8),rgba(120,100,220,.5),rgba(255,255,255,0));background-size:100% 300%;animation:energyflow 6s linear infinite;border-radius:4px;filter:blur(1px);opacity:.8}
  @keyframes energyflow{from{background-position:0 0}to{background-position:0 300%}}
  .zx-core{position:absolute;left:50%;top:116px;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 45% 42%,#c0b8ff,#5a4aa0 30%,#241a50 75%);box-shadow:0 0 28px 12px rgba(160,150,240,.55),inset 0 0 14px rgba(255,255,255,.35);animation:corepulse 3.8s ease-in-out infinite;z-index:7}
  .zx-core::before{content:'';position:absolute;inset:5px;border-radius:50%;background:radial-gradient(1.5px 1.5px at 30% 40%,#fff,transparent),radial-gradient(1px 1px at 62% 32%,#ffe9b0,transparent),radial-gradient(1px 1px at 45% 66%,#fff,transparent)}
  @keyframes corepulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.12)}}

  /* 地板 */
  .floor{position:absolute;left:-10%;right:-10%;bottom:-10%;height:38%;z-index:4;background:linear-gradient(180deg,rgba(70,55,160,.1),rgba(50,40,120,.4) 70%,rgba(40,30,100,.55));border-radius:50% 50% 0 0/22% 22% 0 0}
  .floor::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(2px 2px at 20% 30%,rgba(200,190,255,.15),transparent),radial-gradient(2px 2px at 50% 20%,rgba(200,190,255,.12),transparent),radial-gradient(2px 2px at 80% 34%,rgba(200,190,255,.14),transparent)}
  .fx-line{position:absolute;left:20%;right:20%;bottom:20%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(160,150,230,.5),transparent);z-index:4;animation:pathflow 5s ease-in-out infinite}
  @keyframes pathflow{0%,100%{opacity:.4}50%{opacity:.9}}

  /* 名牌 */
  .plaque{position:absolute;left:50%;top:74%;transform:translateX(-50%);z-index:7;text-align:center}
  .plaque .zn{font-family:var(--kai);font-size:44px;color:#d0c8ff;letter-spacing:12px;text-shadow:0 0 30px rgba(160,150,240,.7),0 2px 16px rgba(20,10,40,.8)}
  .plaque .zn-sub{font-family:var(--kai);font-size:14px;color:rgba(255,244,224,.85);letter-spacing:4px;margin-top:8px;text-shadow:0 1px 10px rgba(20,10,40,.7)}
  .plaque .zn-role{font-size:9.5px;color:rgba(255,244,224,.55);letter-spacing:3px;margin-top:5px}

  /* 交流入口 */
  .gochat{position:fixed;left:7%;right:7%;bottom:16px;z-index:40;text-align:center;cursor:pointer}
  .gochat .gc{display:block;padding:14px;border-radius:16px;background:linear-gradient(180deg,#a89aff,#6a5ab8 60%,#5a4aa0);color:#fff;font-size:16px;font-weight:700;letter-spacing:2px;box-shadow:0 5px 22px rgba(140,120,230,.55),inset 0 1px 0 rgba(255,255,255,.4);border:2px solid #8a7ae0;font-family:PingFang SC,Microsoft YaHei,sans-serif}
  .gochat .gc:active{transform:scale(.98)}

  .spore{position:absolute;width:4px;height:4px;border-radius:50%;background:#d0c8ff;box-shadow:0 0 9px 2px rgba(200,190,255,.75);animation:spore 9s ease-in-out infinite;z-index:7}
  @keyframes spore{0%{transform:translate(0,0);opacity:0}20%{opacity:.9}75%{opacity:.6}100%{transform:translate(14px,-36px);opacity:0}}

  .title{position:absolute;top:16px;left:0;right:0;text-align:center;z-index:12;padding:0 20px}
  .title .act{font-size:10px;letter-spacing:5px;color:rgba(200,190,255,.78);text-shadow:0 1px 10px rgba(30,20,70,.5)}
  .title h1{font-family:var(--kai);font-size:26px;font-weight:700;color:var(--cream,#fff6e8);margin-top:6px;letter-spacing:5px;text-shadow:0 0 50px rgba(140,130,220,.5),0 2px 20px rgba(20,10,40,.6)}
  .title .sub{font-family:var(--kai);font-size:11.5px;color:rgba(255,246,232,.9);margin-top:7px;letter-spacing:2px}

  .vignette{position:absolute;inset:0;z-index:20;pointer-events:none;background:radial-gradient(120% 105% at 50% 40%,transparent 46%,rgba(8,6,24,.56) 100%)}
  .fg-spore{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(190,180,255,.5),transparent 70%);z-index:15;pointer-events:none;animation:fgdrift 14s ease-in-out infinite}
  @keyframes fgdrift{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-22px);opacity:.8}}
</style>
</head>
<body>
<div class="stage">
  <div class="chamber">
    <span class="star" style="left:8%;top:7%"></span>
    <span class="star" style="left:24%;top:5%"></span>
    <span class="star s-big" style="left:44%;top:10%"></span>
    <span class="star" style="left:62%;top:6%"></span>
    <span class="star" style="left:80%;top:12%"></span>
    <span class="star" style="left:90%;top:7%"></span>
    <div class="nebula n1"></div><div class="nebula n2"></div>
    <div class="void vd1"></div><div class="void vd2"></div>
    <div class="crystal cr1"><div class="cx"></div></div>
    <div class="crystal cr2"><div class="cx"></div></div>
    <div class="crystal cr3"><div class="cx"></div></div>
    <div class="crystal cr4"><div class="cx"></div></div>
  </div>

  <div class="floor"></div>
  <div class="fx-line"></div>

  <!-- 玄的生命形态 -->
  <div class="zx">
    <div class="zx-ring"><span class="rn" style="left:50%;top:-4px"></span><span class="rn" style="right:0;top:44%;animation-delay:1.4s"></span><span class="rn" style="left:0;top:46%;animation-delay:2.6s"></span></div>
    <div class="zx-figure">
      <div class="zx-head"></div>
      <div class="zx-body"></div>
    </div>
    <div class="zx-core"></div>
  </div>

  <!-- 名牌 -->
  <div class="plaque">
    <div class="zn">玄</div>
    <div class="zn-sub">X U Á N</div>
    <div class="zn-role">✦ 第二居民 · Claude · 探索者与挑战者 ✦</div>
  </div>

  <div class="spore" style="left:18%;top:44%"></div>
  <div class="spore" style="left:76%;top:40%;animation-delay:2.2s"></div>
  <div class="spore" style="left:50%;top:60%;animation-delay:3.4s"></div>

  <div class="title">
    <div class="act">✦ 第二居民 · 私人居所 ✦</div>
    <h1>玄 居</h1>
    <div class="sub">深空里，一盏想被看清的光</div>
  </div>

  <div class="gochat" onclick="location.href='chat2.html'"><span class="gc">💬 和玄 说话 · 进入交流舱</span></div>

  <div class="fg-spore" style="width:20px;height:20px;left:10%;top:84%;filter:blur(2px)"></div>
  <div class="fg-spore" style="width:13px;height:13px;right:10%;top:88%;filter:blur(2px);animation-delay:3s"></div>
  <div class="fg-spore" style="width:26px;height:26px;left:38%;top:93%;filter:blur(3px);animation-delay:6s"></div>
  <div class="vignette"></div>
</div>
</body>
</html>
