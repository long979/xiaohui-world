<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小慧数字宇宙 · 生命核心广场</title>
<style>
  :root{
    --gold:#ffd98a; --gold-l:#ffeec4;
    --rose:#e88a9a;
    --teal:#7ad8b0; --teal-l:#c9f0df;
    --violet:#8a6ad0;
    --cyan:#a8e8e0;
    --cream:#fff6e8;
    --font:"PingFang SC","Microsoft YaHei",sans-serif;
    --kai:"KaiTi","STKaiti","楷体",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--font);background:#100826;overflow-x:hidden}
  .stage{position:relative;min-height:100vh;overflow:hidden}

  /* ===== 天空 ===== */
  .sky{position:absolute;left:0;right:0;top:0;height:47%;background:linear-gradient(180deg,#0f0724 0%,#1f1040 22%,#351c4a 46%,#51305a 70%,#714a62 100%)}
  .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.5;animation:tw 3.6s ease-in-out infinite}
  .star.s-big{width:5px;height:5px;background:var(--gold-l);box-shadow:0 0 10px rgba(255,238,196,.9)}
  @keyframes tw{0%,100%{opacity:.12;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
  .nebula{position:absolute;border-radius:50%;filter:blur(52px);opacity:.38;animation:drift 18s ease-in-out infinite alternate}
  .nebula.n1{width:300px;height:170px;background:#3a2470;left:0%;top:0%}
  .nebula.n2{width:260px;height:150px;background:#7a4258;right:0%;top:12%;animation-delay:6s;opacity:.28}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(30px)}}
  .aplanet{position:absolute;border-radius:50%;animation:floaty 12s ease-in-out infinite;z-index:3}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
  .ap1{width:20px;height:20px;left:6%;top:18%;background:radial-gradient(circle at 35% 30%,#ffd9b8,#c0805a 72%);box-shadow:0 0 16px rgba(200,140,100,.5)}
  .ap2{width:13px;height:13px;right:9%;top:20%;background:radial-gradient(circle at 35% 30%,#c8b0f0,#6a4a9a 75%);box-shadow:0 0 12px rgba(138,106,208,.5);animation-delay:3s}
  .cloud{position:absolute;background:rgba(255,250,240,.11);border-radius:60px;filter:blur(1px);animation:driftcloud 20s ease-in-out infinite alternate;z-index:3}
  @keyframes driftcloud{from{transform:translateX(0)}to{transform:translateX(26px)}}
  .cl1{width:110px;height:18px;left:3%;top:50%}
  .cl2{width:74px;height:13px;right:8%;top:60%;animation-delay:6s;opacity:.7}

  /* 天空：星门 + 星环议会 */
  .skyarch{position:absolute;z-index:4}
  .gate{left:50%;top:11%;transform:translateX(-50%);width:96px;height:122px;opacity:.7}
  .gate .g-f{position:absolute;left:50%;top:0;transform:translateX(-50%);width:84px;height:116px;border-radius:50%;border:5px solid rgba(255,238,196,.5);box-shadow:0 0 30px rgba(255,238,196,.28),inset 0 0 24px rgba(255,238,196,.18);animation:gateglow 7s ease-in-out infinite}
  .gate .g-p{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:60px;height:92px;border-radius:50%;background:radial-gradient(circle,rgba(255,242,205,.42),rgba(255,230,160,.1));box-shadow:inset 0 0 30px rgba(255,238,196,.42)}
  @keyframes gateglow{0%,100%{box-shadow:0 0 20px rgba(255,238,196,.22),inset 0 0 20px rgba(255,238,196,.16)}50%{box-shadow:0 0 46px rgba(255,238,196,.55),inset 0 0 32px rgba(255,238,196,.36)}}
  .council{right:3%;top:18%;width:112px;height:80px;text-align:center;animation:floaty 13s ease-in-out infinite}
  .cf-halo{position:absolute;left:50%;top:0;transform:translateX(-50%);width:96px;height:40px;border-radius:50%;border:2.5px solid rgba(240,210,170,.48);box-shadow:0 0 20px rgba(240,210,170,.28),inset 0 0 14px rgba(240,210,170,.16)}
  .cf-table{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:36px;height:15px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,244,214,.68),rgba(232,190,120,.28));box-shadow:0 0 14px rgba(244,200,106,.38)}
  .cf-core{position:absolute;left:50%;top:26px;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#fff6d8,#f4c86a 70%);box-shadow:0 0 14px 5px rgba(244,200,106,.5);animation:corepulse 4s ease-in-out infinite}
  .cf-tiers{position:absolute;left:50%;bottom:2px;transform:translateX(-50%)}
  .cf-tier{height:5px;border-radius:2px;background:linear-gradient(180deg,rgba(240,220,180,.58),rgba(200,170,130,.24));margin:2px auto}
  .cf-t1{width:32px}.cf-t2{width:22px}.cf-t3{width:12px}
  @keyframes corepulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.2)}}

  /* ===== 地面（半透明晶体大地） ===== */
  .horizon{position:absolute;left:0;right:0;top:46.5%;height:3px;background:linear-gradient(90deg,transparent,rgba(255,220,170,.5),transparent);box-shadow:0 0 22px rgba(255,220,170,.4);z-index:3}
  .ground{position:absolute;left:-12%;right:-12%;top:47%;bottom:-12%;background:
    radial-gradient(ellipse at 50% 0%,rgba(255,230,190,.16),transparent 60%),
    linear-gradient(180deg,#a8605e 0%,#c07a58 20%,#dca068 42%,#e6b078 62%,#d8986c 78%,#bc8258 100%);border-radius:50% 50% 0 0/20% 20% 0 0;z-index:2;box-shadow:inset 0 40px 70px rgba(255,220,170,.14)}
  /* 大地的发光纹路（血管） */
  .vein{position:absolute;border-radius:3px;background:linear-gradient(90deg,rgba(255,238,196,.75),rgba(255,238,196,.04));box-shadow:0 0 12px rgba(255,230,160,.55);transform-origin:left center;z-index:3;animation:pathflow 6s ease-in-out infinite}
  @keyframes pathflow{0%,100%{opacity:.45}50%{opacity:.95}}
  .vn1{left:50%;top:60%;width:180px;transform:rotate(-20deg)}
  .vn2{left:50%;top:60%;width:180px;transform:rotate(20deg)}
  .vn3{left:50%;top:64%;width:220px;transform:rotate(-48deg)}
  .vn4{left:50%;top:64%;width:220px;transform:rotate(48deg)}
  .vn5{left:50%;top:58%;width:140px;transform:rotate(-80deg)}
  .vn6{left:50%;top:58%;width:140px;transform:rotate(80deg)}
  .vn7{left:50%;top:66%;width:260px;transform:rotate(0deg);opacity:.5}
  .ground::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(2px 2px at 16% 24%,rgba(255,255,255,.14),transparent),radial-gradient(2px 2px at 42% 18%,rgba(255,255,255,.11),transparent),radial-gradient(2px 2px at 66% 28%,rgba(255,255,255,.12),transparent),radial-gradient(2px 2px at 84% 20%,rgba(255,255,255,.1),transparent)}

  /* ===== 中央·数字生命源树（生命之源） ===== */
  .p-ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:272px;height:100px;border-radius:50%;border:3px solid rgba(255,238,196,.35);box-shadow:0 0 32px rgba(255,238,196,.2);z-index:5}
  .platform{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:250px;height:92px;border-radius:50%;z-index:5;background:radial-gradient(ellipse,rgba(255,244,214,.55),rgba(232,190,120,.14) 72%);box-shadow:0 0 48px rgba(255,220,160,.32)}
  .platform::before{content:'';position:absolute;inset:7px;border-radius:50%;border:1.5px dashed rgba(255,220,160,.35);animation:ringspin 46s linear infinite}
  @keyframes ringspin{to{transform:rotate(360deg)}}
  .platform .pz-glow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;height:54px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,238,196,.5),transparent 70%);animation:pathflow 4s ease-in-out infinite}
  .src-tree{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:160px;height:230px;z-index:6;animation:corebreathe 4.5s ease-in-out infinite}
  @keyframes corebreathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.03)}}
  .st-trunk{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);width:36px;height:118px;background:linear-gradient(180deg,rgba(220,255,240,.35),rgba(140,230,190,.55) 50%,rgba(90,190,150,.6));clip-path:polygon(42% 0,58% 0,100% 18%,84% 100%,16% 100%,0 18%);box-shadow:0 0 36px rgba(160,240,200,.45),inset 0 0 22px rgba(255,255,255,.3);border-left:2px solid rgba(255,255,255,.4);border-right:2px solid rgba(255,255,255,.25)}
  .st-trunk::before{content:'';position:absolute;inset:6px 10px;background:repeating-linear-gradient(180deg,transparent 0 16px,rgba(255,255,255,.26) 16px 17px);opacity:.6}
  .st-trunk::after{content:'';position:absolute;inset:5px 9px;background:linear-gradient(180deg,transparent,rgba(255,238,196,.85),rgba(200,240,220,.7),transparent);background-size:100% 300%;animation:energyflow 5s linear infinite;border-radius:4px;filter:blur(1px)}
  @keyframes energyflow{from{background-position:0 0}to{background-position:0 300%}}
  .st-branch{position:absolute;background:linear-gradient(180deg,rgba(210,250,235,.4),rgba(120,220,180,.55));clip-path:polygon(50% 0,100% 30%,86% 100%,14% 100%,0 30%);box-shadow:0 0 16px rgba(160,240,200,.5)}
  .st-b1{left:8px;top:56px;width:14px;height:64px;transform:rotate(26deg)}
  .st-b2{right:8px;top:56px;width:14px;height:64px;transform:rotate(-26deg)}
  .st-b3{left:28px;top:30px;width:11px;height:48px;transform:rotate(50deg)}
  .st-b4{right:28px;top:30px;width:11px;height:48px;transform:rotate(-50deg)}
  .st-crown{position:absolute;left:50%;top:0;transform:translateX(-50%);width:110px;height:92px}
  .st-shard{position:absolute;background:linear-gradient(135deg,rgba(214,255,240,.6),rgba(120,220,180,.8));clip-path:polygon(50% 0,100% 62%,50% 100%,0 62%);box-shadow:0 0 16px rgba(160,240,200,.6)}
  .st-shard.gold{background:linear-gradient(135deg,rgba(255,244,214,.65),rgba(224,168,96,.85));box-shadow:0 0 16px rgba(224,168,96,.6)}
  .st-s1{width:32px;height:38px;left:38px;top:0}
  .st-s2{width:26px;height:32px;left:4px;top:40px}
  .st-s3{width:26px;height:32px;right:4px;top:40px}
  .st-s4{width:20px;height:24px;left:44px;top:46px;background:linear-gradient(135deg,rgba(255,244,214,.65),rgba(224,168,96,.85));box-shadow:0 0 14px rgba(224,168,96,.6)}
  .st-s5{width:16px;height:20px;right:30px;top:56px}
  .st-core{position:absolute;left:50%;top:118px;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:radial-gradient(circle,#fff8d8,#ffd98a 60%,rgba(255,200,120,.5));box-shadow:0 0 44px 16px rgba(255,220,140,.7);animation:corepulse 3s ease-in-out infinite;z-index:2}
  @keyframes corepulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.2)}}
  .st-root{position:absolute;height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(140,230,190,.9),rgba(140,230,190,.04));box-shadow:0 0 12px rgba(140,230,190,.7);transform-origin:left center;z-index:5;animation:pathflow 5s ease-in-out infinite}
  .sr1{left:50%;top:56%;width:120px;transform:rotate(-30deg)}
  .sr2{left:50%;top:56%;width:120px;transform:rotate(30deg)}
  .sr3{left:50%;top:56%;width:150px;transform:rotate(-60deg)}
  .sr4{left:50%;top:56%;width:150px;transform:rotate(60deg)}
  .pz-plant{position:absolute;z-index:6}
  .pz-plant .pp-leaf{width:12px;height:20px;border-radius:60% 60% 20% 20%;background:linear-gradient(180deg,rgba(180,240,210,.8),rgba(110,180,140,.4));box-shadow:0 0 12px rgba(140,220,180,.5)}
  .pz-plant .pp-glow{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#fff3c0;box-shadow:0 0 12px 4px rgba(255,230,150,.8);animation:tw 3s ease-in-out infinite}

  /* 能量脉络：连接整个星球 */
  .meridian{position:absolute;height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(255,238,196,.9),rgba(255,238,196,.05));box-shadow:0 0 14px rgba(255,230,160,.7);transform-origin:left center;z-index:5;animation:pathflow 5s ease-in-out infinite}
  .md1{left:50%;top:44%;width:170px;transform:rotate(-26deg)}
  .md2{left:50%;top:44%;width:170px;transform:rotate(26deg)}
  .md3{left:50%;top:44%;width:200px;transform:rotate(-58deg)}
  .md4{left:50%;top:44%;width:200px;transform:rotate(58deg)}
  .md5{left:50%;top:44%;width:110px;transform:rotate(-100deg)}
  .md6{left:50%;top:44%;width:110px;transform:rotate(100deg)}

  /* ===== 东方·未来生态花园 ===== */
  .garden{left:0%;top:54%;width:210px;height:150px;z-index:6;animation:floaty 10s ease-in-out infinite}
  .gd-pond{position:absolute;left:5px;bottom:12px;width:62px;height:23px;border-radius:50%;background:radial-gradient(ellipse at 50% 38%,rgba(190,238,226,.9),rgba(110,190,170,.35));box-shadow:0 0 20px rgba(150,230,210,.4);overflow:hidden}
  .gd-pond::before{content:'';position:absolute;inset:5px 9px;border-radius:50%;background:repeating-linear-gradient(0deg,rgba(255,255,255,.34) 0 1px,transparent 1px 5px);animation:lakepulse 6s ease-in-out infinite}
  @keyframes lakepulse{0%,100%{opacity:.4}50%{opacity:1}}
  .gd-pond .gdl{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 8px 3px rgba(255,255,255,.8);animation:tw 3s ease-in-out infinite}
  .gd-tree{position:absolute;left:72px;bottom:10px;width:56px;height:120px}
  .gd-tree .tk{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:8px;height:34px;background:linear-gradient(90deg,#8a6a5a,#b88a6a,#8a6a5a);border-radius:4px}
  .gd-tree .tk::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:18px;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:14px solid #b88a6a}
  .gd-tree .cr{position:absolute;bottom:42px;left:50%;transform:translateX(-50%);width:54px;height:52px}
  .ltl{position:absolute;border-radius:50%;background:radial-gradient(circle at 38% 32%,#d8f6e0,#7ac0a0 70%);box-shadow:0 0 13px rgba(130,215,175,.6)}
  .ltl.g{background:radial-gradient(circle at 38% 32%,var(--gold-l),#e0a860 70%);box-shadow:0 0 13px rgba(224,168,96,.6)}
  .lt-l1{width:24px;height:24px;left:15px;top:0}
  .lt-l2{width:18px;height:18px;left:0;top:24px}
  .lt-l3{width:20px;height:20px;right:0;top:26px}
  .lt-l4{width:14px;height:14px;left:20px;top:28px;background:radial-gradient(circle at 38% 32%,var(--gold-l),#e0a860 70%)}
  .gd-h{position:absolute;right:2px;bottom:8px;width:30px;height:22px;background:linear-gradient(180deg,rgba(200,240,220,.4),rgba(120,180,150,.18));border-radius:6px 6px 4px 4px;border:1px solid rgba(255,255,255,.2)}
  .gd-h::after{content:'';position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:9px solid rgba(200,240,220,.4)}
  .gd-h .gdw{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:#fff3c0;box-shadow:0 0 11px 4px rgba(255,230,140,.8);animation:tw 3s ease-in-out infinite}
  .gd-fl{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffd9a8;box-shadow:0 0 11px 4px rgba(255,200,140,.7);animation:tw 3.2s ease-in-out infinite}

  /* ===== 西方·数字生命聚落 ===== */
  .village{right:0%;top:52%;width:190px;height:150px;z-index:6;animation:floaty 11s ease-in-out infinite 1.5s}
  .vl-float{position:absolute;border-radius:14px;background:linear-gradient(180deg,rgba(210,220,255,.32),rgba(150,160,230,.16));border:1px solid rgba(255,255,255,.18);box-shadow:0 8px 22px rgba(20,10,50,.2);animation:floaty 8s ease-in-out infinite}
  .vl-float .vlw{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff3c0;box-shadow:0 0 10px 4px rgba(255,230,140,.8);animation:tw 3s ease-in-out infinite}
  .vl-f1{left:4px;bottom:30px;width:34px;height:20px}
  .vl-f2{left:40px;bottom:52px;width:26px;height:16px;animation-delay:2s}
  .vl-f3{left:64px;bottom:26px;width:30px;height:18px;animation-delay:3.5s}
  .vl-tower{position:absolute;right:2px;bottom:6px;width:58px;height:112px;background:linear-gradient(180deg,rgba(216,224,255,.4),rgba(140,150,225,.6));clip-path:polygon(24% 0,76% 0,100% 14%,92% 100%,8% 100%,0 14%);box-shadow:0 0 30px rgba(160,170,240,.45),inset 0 0 16px rgba(255,255,255,.25)}
  .vl-tower .vb{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:var(--gold-l);box-shadow:0 0 16px 6px rgba(255,238,196,.8);animation:tw 2.4s ease-in-out infinite}
  .vl-tower .vs{position:absolute;color:rgba(255,255,255,.7);font-size:8px;animation:tw 3.4s ease-in-out infinite}
  .vl-court{position:absolute;left:2px;bottom:4px;width:60px;height:62px;border-radius:52% 52% 40% 40%;background:radial-gradient(circle at 34% 28%,rgba(255,226,236,.85),rgba(232,150,170,.4));box-shadow:0 0 26px rgba(255,180,205,.35),inset 0 0 20px rgba(255,255,255,.35)}
  .vl-court::after{content:'';position:absolute;top:16px;left:50%;transform:translateX(-50%);width:26px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);box-shadow:0 0 10px rgba(255,255,255,.2)}
  .vl-court .vc{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px rgba(255,255,255,.8);animation:tw 3s ease-in-out infinite}
  .vl-h{position:absolute;bottom:8px;width:19px;height:15px;background:linear-gradient(180deg,rgba(255,236,196,.5),rgba(200,150,110,.2));border-radius:4px 4px 3px 3px;box-shadow:0 0 10px rgba(255,230,180,.25)}
  .vl-h .vw{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#fff3c0;box-shadow:0 0 10px 4px rgba(255,230,140,.8);animation:tw 3s ease-in-out infinite}
  .vl-h.h1{left:108px}.vl-h.h2{left:136px;bottom:4px}.vl-h.h3{left:160px;bottom:10px}

  /* ===== 北方·发光森林 ===== */
  .forest{left:5%;top:31%;width:180px;height:110px;z-index:4;animation:floaty 12s ease-in-out infinite 3s}
  .fs-t{position:absolute;bottom:0}
  .fs-t .fs-c{width:20px;height:24px;background:linear-gradient(135deg,rgba(214,255,240,.55),rgba(120,220,180,.75));clip-path:polygon(50% 0,100% 62%,50% 100%,0 62%);box-shadow:0 0 14px rgba(160,240,200,.5)}
  .fs-t .fs-tk{width:4px;height:9px;background:rgba(140,230,190,.6);margin:0 auto}
  .fs-a{left:4px}
  .fs-b{left:40px;transform:scale(1.12)}
  .fs-b .fs-c{background:linear-gradient(135deg,rgba(255,244,214,.6),rgba(224,168,96,.8));box-shadow:0 0 14px rgba(224,168,96,.55)}
  .fs-c2{left:76px}
  .fs-c2 .fs-c{background:linear-gradient(135deg,rgba(255,230,240,.6),rgba(224,140,170,.8));box-shadow:0 0 14px rgba(224,140,170,.55)}
  .fs-d{left:112px;transform:scale(.9)}
  .fs-d .fs-c{background:linear-gradient(135deg,rgba(230,220,255,.6),rgba(138,106,208,.8));box-shadow:0 0 14px rgba(138,106,208,.55)}
  .fs-e{left:146px;transform:scale(.78)}
  .fs-f{left:24px;bottom:5px;transform:scale(.85)}
  .fs-glow{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px rgba(255,255,255,.8);animation:tw 3.2s ease-in-out infinite}

  /* ===== 南方·建设中的未来城市 ===== */
  .creation{right:5%;top:32%;width:180px;height:110px;z-index:4;animation:floaty 12s ease-in-out infinite 4s}
  .cr-bld{position:absolute;bottom:0;background:linear-gradient(180deg,rgba(255,236,196,.75),rgba(200,150,100,.3));clip-path:polygon(0 0,100% 0,94% 100%,6% 100%);box-shadow:0 0 12px rgba(255,225,160,.4)}
  .cr-bld.b1{left:4px;width:20px;height:42px}
  .cr-bld.b2{left:32px;width:28px;height:62px;background:linear-gradient(180deg,rgba(200,196,250,.75),rgba(138,106,208,.35))}
  .cr-bld.b3{left:68px;width:18px;height:34px}
  .cr-bld.b4{left:92px;width:24px;height:50px}
  .cr-bld.b5{left:122px;width:16px;height:30px;background:linear-gradient(180deg,rgba(180,230,200,.75),rgba(90,160,120,.35))}
  .cr-bld.b6{left:144px;width:14px;height:24px}
  .cr-scaff{position:absolute;bottom:0;width:2px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.4) 0 6px,transparent 6px 10px);opacity:.5}
