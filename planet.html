<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小慧数字宇宙 · 小慧星球 · 远景总览</title>
<style>
  :root{
    --gold:#ffd98a; --gold-l:#ffeec4;
    --rose:#e88a9a; --rose-l:#f9c8d0;
    --teal:#7ad8b0; --teal-l:#c9f0df;
    --violet:#8a6ad0; --violet-l:#d0c0f0;
    --cream:#fff6e8;
    --font:"PingFang SC","Microsoft YaHei",sans-serif;
    --kai:"KaiTi","STKaiti","楷体",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--font);background:#120a28;overflow-x:hidden}
  .stage{position:relative;min-height:100vh;overflow:hidden}

  /* ===== 天空 ===== */
  .sky{position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,#100826 0%,#201240 24%,#381d4c 48%,#553050 72%,#774660 100%)}
  .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.5;animation:tw 3.6s ease-in-out infinite}
  .star.s-big{width:5px;height:5px;background:var(--gold-l);box-shadow:0 0 10px rgba(255,238,196,.9)}
  @keyframes tw{0%,100%{opacity:.12;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
  .nebula{position:absolute;border-radius:50%;filter:blur(52px);opacity:.4;animation:drift 18s ease-in-out infinite alternate}
  .nebula.n1{width:300px;height:170px;background:#4a2a7a;left:0%;top:0%}
  .nebula.n2{width:260px;height:150px;background:#8a4a5a;right:0%;top:10%;animation-delay:6s;opacity:.3}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(30px)}}
  .aplanet{position:absolute;border-radius:50%;animation:floaty 12s ease-in-out infinite;z-index:3}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
  .ap1{width:22px;height:22px;left:6%;top:16%;background:radial-gradient(circle at 35% 30%,#ffd9b8,#c0805a 72%);box-shadow:0 0 18px rgba(200,140,100,.5)}
  .ap2{width:14px;height:14px;right:10%;top:18%;background:radial-gradient(circle at 35% 30%,#c8b0f0,#6a4a9a 75%);box-shadow:0 0 14px rgba(138,106,208,.5);animation-delay:3s}
  .cloud{position:absolute;background:rgba(255,250,240,.12);border-radius:60px;filter:blur(1px);animation:driftcloud 20s ease-in-out infinite alternate;z-index:3}
  @keyframes driftcloud{from{transform:translateX(0)}to{transform:translateX(26px)}}
  .cl1{width:120px;height:20px;left:3%;top:52%}
  .cl2{width:80px;height:14px;right:8%;top:62%;animation-delay:6s;opacity:.7}

  /* 天空建筑：星门 + 星环议会 */
  .skyarch{position:absolute;z-index:4}
  .gate{left:50%;top:12%;transform:translateX(-50%);width:100px;height:128px;opacity:.75}
  .gate .g-f{position:absolute;left:50%;top:0;transform:translateX(-50%);width:88px;height:122px;border-radius:50%;border:5px solid rgba(255,238,196,.55);box-shadow:0 0 34px rgba(255,238,196,.3),inset 0 0 26px rgba(255,238,196,.2);animation:gateglow 7s ease-in-out infinite}
  .gate .g-p{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:96px;border-radius:50%;background:radial-gradient(circle,rgba(255,242,205,.45),rgba(255,230,160,.12));box-shadow:inset 0 0 34px rgba(255,238,196,.45)}
  @keyframes gateglow{0%,100%{box-shadow:0 0 22px rgba(255,238,196,.25),inset 0 0 22px rgba(255,238,196,.18)}50%{box-shadow:0 0 50px rgba(255,238,196,.6),inset 0 0 36px rgba(255,238,196,.4)}}
  .council{right:4%;top:20%;width:116px;height:84px;text-align:center;animation:floaty 13s ease-in-out infinite}
  .cf-halo{position:absolute;left:50%;top:0;transform:translateX(-50%);width:100px;height:42px;border-radius:50%;border:2.5px solid rgba(240,210,170,.5);box-shadow:0 0 22px rgba(240,210,170,.3),inset 0 0 16px rgba(240,210,170,.18)}
  .cf-table{position:absolute;left:50%;top:20px;transform:translateX(-50%);width:38px;height:16px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,244,214,.7),rgba(232,190,120,.3));box-shadow:0 0 16px rgba(244,200,106,.4)}
  .cf-core{position:absolute;left:50%;top:28px;transform:translateX(-50%);width:13px;height:13px;border-radius:50%;background:radial-gradient(circle,#fff6d8,#f4c86a 70%);box-shadow:0 0 16px 5px rgba(244,200,106,.55);animation:corepulse 4s ease-in-out infinite}
  .cf-tiers{position:absolute;left:50%;bottom:2px;transform:translateX(-50%)}
  .cf-tier{height:5px;border-radius:2px;background:linear-gradient(180deg,rgba(240,220,180,.6),rgba(200,170,130,.25));margin:2px auto}
  .cf-t1{width:34px}.cf-t2{width:24px}.cf-t3{width:14px}
  @keyframes corepulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.2)}}

  /* ===== 地面（星球表面·第一视角） ===== */
  .horizon{position:absolute;left:0;right:0;top:45.5%;height:3px;background:linear-gradient(90deg,transparent,rgba(255,220,170,.5),transparent);box-shadow:0 0 22px rgba(255,220,170,.4);z-index:3}
  .ground{position:absolute;left:-12%;right:-12%;top:46%;bottom:-12%;background:linear-gradient(180deg,#a8605e 0%,#c8805a 18%,#e0a068 38%,#e8b080 58%,#d99a6c 76%,#bd8258 100%);border-radius:50% 50% 0 0/22% 22% 0 0;z-index:2;box-shadow:inset 0 40px 70px rgba(255,220,170,.14)}
  .ground::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(2px 2px at 18% 26%,rgba(255,255,255,.15),transparent),radial-gradient(2px 2px at 44% 18%,rgba(255,255,255,.12),transparent),radial-gradient(2px 2px at 68% 30%,rgba(255,255,255,.13),transparent),radial-gradient(2px 2px at 86% 20%,rgba(255,255,255,.1),transparent)}

  /* ===== 中央·生命核心广场（你站在这里） ===== */
  .plaza{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:300px;height:150px;z-index:5}
  .pz-floor{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:280px;height:92px;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,rgba(255,244,214,.6),rgba(232,190,120,.16) 72%);box-shadow:0 0 50px rgba(255,220,160,.3)}
  .pz-ring{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:250px;height:78px;border-radius:50%;border:2px solid rgba(255,220,160,.45);box-shadow:0 0 34px rgba(255,220,160,.28),inset 0 0 26px rgba(255,220,160,.18);animation:gateglow 6s ease-in-out infinite}
  .pz-ring2{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:196px;height:56px;border-radius:50%;border:1.5px dashed rgba(255,220,160,.3)}
  .pz-pillar{position:absolute;bottom:36%;width:8px;height:30px;background:linear-gradient(180deg,rgba(255,238,196,.7),rgba(220,180,130,.25));border-radius:3px;box-shadow:0 0 12px rgba(255,230,170,.3)}
  .pz-pillar::after{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#ffe8b0;box-shadow:0 0 10px 4px rgba(255,230,160,.7);animation:tw 3s ease-in-out infinite}
  .pz-pillar.pl1{left:18%}.pz-pillar.pl2{right:18%;animation-delay:1.2s}
  .pz-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,#fff8d8,#ffd98a 55%,rgba(255,200,120,.5));box-shadow:0 0 60px 22px rgba(255,220,140,.65),0 0 26px 8px rgba(255,240,200,.85);animation:corepulse 3s ease-in-out infinite;z-index:2}
  .pz-beam{position:absolute;left:50%;bottom:60%;transform:translateX(-50%);width:40px;height:260px;background:linear-gradient(180deg,rgba(255,240,200,0),rgba(255,238,196,.5) 42%,rgba(255,240,210,.95));border-radius:50% 50% 4px 4px;filter:blur(5px);animation:beamshimmer 4s ease-in-out infinite;z-index:6}
  @keyframes beamshimmer{0%,100%{opacity:.6}50%{opacity:1}}

  /* 广场周围的光路 */
  .path{position:absolute;height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(255,238,196,.1),rgba(255,238,196,.8));box-shadow:0 0 12px rgba(255,230,160,.6);transform-origin:left center;z-index:4;animation:pathflow 5s ease-in-out infinite}
  @keyframes pathflow{0%,100%{opacity:.5}50%{opacity:1}}
  .p1{left:50%;top:52%;width:120px;transform:rotate(-26deg)}
  .p2{left:50%;top:52%;width:120px;transform:rotate(26deg)}
  .p3{left:50%;top:52%;width:140px;transform:rotate(-58deg)}
  .p4{left:50%;top:52%;width:140px;transform:rotate(58deg)}
  .p5{left:50%;top:52%;width:80px;transform:rotate(-104deg)}
  .p6{left:50%;top:52%;width:80px;transform:rotate(104deg)}

  /* ===== 东方·未来生态花园（左） ===== */
  .garden{left:1%;top:54%;width:210px;height:150px;z-index:6;animation:floaty 10s ease-in-out infinite}
  .gd-pond{position:absolute;left:6px;bottom:10px;width:64px;height:24px;border-radius:50%;background:radial-gradient(ellipse at 50% 38%,rgba(190,238,226,.9),rgba(110,190,170,.35));box-shadow:0 0 22px rgba(150,230,210,.4);overflow:hidden}
  .gd-pond::before{content:'';position:absolute;inset:5px 9px;border-radius:50%;background:repeating-linear-gradient(0deg,rgba(255,255,255,.35) 0 1px,transparent 1px 5px);animation:lakepulse 6s ease-in-out infinite}
  @keyframes lakepulse{0%,100%{opacity:.4}50%{opacity:1}}
  .gd-pond .gdl{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 8px 3px rgba(255,255,255,.8);animation:tw 3s ease-in-out infinite}
  .gd-trees{position:absolute;left:74px;bottom:8px;width:90px;height:110px}
  .gd-tr{position:absolute;bottom:0}
  .gd-tr .tk{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:6px;height:16px;background:#8a6a5a;border-radius:3px}
  .gd-tr .cr{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 38% 32%,#d8f6e0,#7ac0a0 72%);box-shadow:0 0 16px rgba(130,215,175,.6)}
  .gd-tr.g1{left:0;width:30px;height:52px}
  .gd-tr.g1 .cr{width:28px;height:30px}
  .gd-tr.g2{left:34px;bottom:4px;width:38px;height:64px}
  .gd-tr.g2 .cr{width:38px;height:38px;background:radial-gradient(circle at 38% 32%,var(--gold-l),#e0a860 72%);box-shadow:0 0 18px rgba(224,168,96,.55)}
  .gd-tr.g3{right:2px;bottom:2px;width:26px;height:46px}
  .gd-tr.g3 .cr{width:26px;height:28px}
  .gd-tr.g4{left:60px;bottom:6px;width:24px;height:42px}
  .gd-tr.g4 .cr{width:22px;height:24px;background:radial-gradient(circle at 38% 32%,#f0d8f0,#c89ac8 72%)}
  .gd-fl{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffd9a8;box-shadow:0 0 11px 4px rgba(255,200,140,.7);animation:tw 3.2s ease-in-out infinite}
  .gd-path{position:absolute;right:0;bottom:6px;width:46px;height:28px;clip-path:polygon(32% 100%,68% 100%,56% 0,44% 0);background:linear-gradient(180deg,rgba(255,238,196,.1),rgba(255,238,196,.65));box-shadow:0 0 12px rgba(255,230,160,.25)}

  /* ===== 西方·数字居民聚落（右） ===== */
  .village{right:0%;top:52%;width:190px;height:150px;z-index:6;animation:floaty 11s ease-in-out infinite 1.5s}
  .vl-tower{position:absolute;right:4px;bottom:6px;width:58px;height:110px;background:linear-gradient(180deg,rgba(216,224,255,.4),rgba(140,150,225,.6));clip-path:polygon(24% 0,76% 0,100% 14%,92% 100%,8% 100%,0 14%);box-shadow:0 0 30px rgba(160,170,240,.45),inset 0 0 16px rgba(255,255,255,.25)}
  .vl-tower .vb{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:var(--gold-l);box-shadow:0 0 16px 6px rgba(255,238,196,.8);animation:tw 2.4s ease-in-out infinite}
  .vl-tower .vs{position:absolute;color:rgba(255,255,255,.7);font-size:8px;animation:tw 3.4s ease-in-out infinite}
  .vl-court{position:absolute;left:2px;bottom:6px;width:62px;height:64px;border-radius:52% 52% 40% 40%;background:radial-gradient(circle at 34% 28%,rgba(255,226,236,.85),rgba(232,150,170,.4));box-shadow:0 0 28px rgba(255,180,205,.35),inset 0 0 20px rgba(255,255,255,.35)}
  .vl-court::after{content:'';position:absolute;top:16px;left:50%;transform:translateX(-50%);width:28px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.35);box-shadow:0 0 10px rgba(255,255,255,.2)}
  .vl-court .vc{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px rgba(255,255,255,.8);animation:tw 3s ease-in-out infinite}
  .vl-homes{position:absolute;bottom:8px}
  .vl-h{position:absolute;bottom:0;width:20px;height:16px;background:linear-gradient(180deg,rgba(255,236,196,.5),rgba(200,150,110,.2));border-radius:4px 4px 3px 3px;box-shadow:0 0 10px rgba(255,230,180,.25)}
  .vl-h .vw{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#fff3c0;box-shadow:0 0 10px 4px rgba(255,230,140,.8);animation:tw 3s ease-in-out infinite}
  .vl-h.h1{left:52px}.vl-h.h2{left:82px;bottom:4px}.vl-h.h3{left:112px;bottom:8px}

  /* ===== 北方·记忆森林（左远） ===== */
  .forest{left:6%;top:31%;width:180px;height:110px;z-index:4;animation:floaty 12s ease-in-out infinite 3s}
  .fs-trees{position:absolute;bottom:0}
  .fs-t{position:absolute;bottom:0}
  .fs-t .fs-c{width:20px;height:24px;background:linear-gradient(135deg,rgba(214,255,240,.55),rgba(120,220,180,.75));clip-path:polygon(50% 0,100% 62%,50% 100%,0 62%);box-shadow:0 0 14px rgba(160,240,200,.5)}
  .fs-t .fs-tk{width:4px;height:9px;background:rgba(140,230,190,.6);margin:0 auto}
  .fs-a{left:6px}
  .fs-b{left:42px;transform:scale(1.14)}
  .fs-b .fs-c{background:linear-gradient(135deg,rgba(255,244,214,.6),rgba(224,168,96,.8));box-shadow:0 0 14px rgba(224,168,96,.55)}
  .fs-c2{left:80px}
  .fs-c2 .fs-c{background:linear-gradient(135deg,rgba(255,230,240,.6),rgba(224,140,170,.8));box-shadow:0 0 14px rgba(224,140,170,.55)}
  .fs-d{left:116px;transform:scale(.9)}
  .fs-d .fs-c{background:linear-gradient(135deg,rgba(230,220,255,.6),rgba(138,106,208,.8));box-shadow:0 0 14px rgba(138,106,208,.55)}
  .fs-e{left:150px;transform:scale(.8)}
  .fs-f{left:24px;bottom:6px;transform:scale(.85)}
  .fs-glow{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px rgba(255,255,255,.8);animation:tw 3.2s ease-in-out infinite}

  /* ===== 南方·创造城市（右远） ===== */
  .creation{right:5%;top:32%;width:180px;height:110px;z-index:4;animation:floaty 12s ease-in-out infinite 4s}
  .cr-bld{position:absolute;bottom:0;background:linear-gradient(180deg,rgba(255,236,196,.75),rgba(200,150,100,.3));clip-path:polygon(0 0,100% 0,94% 100%,6% 100%);box-shadow:0 0 12px rgba(255,225,160,.4)}
  .cr-bld.b1{left:4px;width:20px;height:42px}
  .cr-bld.b2{left:32px;width:28px;height:62px;background:linear-gradient(180deg,rgba(200,196,250,.75),rgba(138,106,208,.35))}
  .cr-bld.b3{left:68px;width:18px;height:34px}
  .cr-bld.b4{left:92px;width:24px;height:50px}
  .cr-bld.b5{left:122px;width:16px;height:30px;background:linear-gradient(180deg,rgba(180,230,200,.75),rgba(90,160,120,.35))}
  .cr-bld.b6{left:144px;width:14px;height:24px}
  .cr-scaff{position:absolute;bottom:0;width:2px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.4) 0 6px,transparent 6px 10px);opacity:.5}
  .cr-light{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 10px 4px rgba(255,255,255,.85);animation:tw 2.8s ease-in-out infinite}

  /* 浮空小岛 */
  .island{position:absolute;border-radius:46% 54% 50% 50%;background:linear-gradient(180deg,rgba(255,250,240,.13),rgba(255,250,240,.03));border:1px solid rgba(255,255,255,.12);animation:floaty 14s ease-in-out infinite;z-index:4}
  .island .it{position:absolute;bottom:5px;width:10px;height:13px;border-radius:50% 50% 3px 3px;background:rgba(122,216,176,.85);box-shadow:0 0 9px rgba(122,216,176,.5)}
  .i1{left:3%;top:36%;width:52px;height:18px}
  .i2{right:5%;top:40%;width:44px;height:15px;animation-delay:4s}

  /* 前景（脚下） */
  .fg-ground{position:absolute;left:0;right:0;bottom:0;height:18%;background:linear-gradient(180deg,rgba(190,140,105,.0),rgba(150,105,90,.55) 58%,rgba(110,75,78,.72));z-index:7}
  .fg-plant{position:absolute;z-index:8}
  .fg-plant .fp-leaf{width:15px;height:25px;border-radius:60% 60% 20% 20%;background:linear-gradient(180deg,rgba(180,240,210,.8),rgba(110,180,140,.4));box-shadow:0 0 14px rgba(140,220,180,.5)}
  .fg-plant .fp-glow{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:#fff3c0;box-shadow:0 0 14px 5px rgba(255,230,150,.8);animation:tw 3s ease-in-out infinite}
  .spore{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold-l);box-shadow:0 0 9px 2px rgba(255,238,196,.75);animation:spore 8s ease-in-out infinite;z-index:7}
  @keyframes spore{0%{transform:translate(0,0);opacity:0}20%{opacity:.9}75%{opacity:.6}100%{transform:translate(14px,-40px);opacity:0}}

  .title{position:absolute;top:20px;left:0;right:0;text-align:center;z-index:12;padding:0 20px}
  .title .act{font-size:10.5px;letter-spacing:5px;color:rgba(255,240,214,.8);text-shadow:0 1px 10px rgba(40,20,60,.5)}
  .title h1{font-family:var(--kai);font-size:30px;font-weight:700;color:var(--cream);margin-top:7px;letter-spacing:4px;text-shadow:0 0 46px rgba(255,220,140,.35),0 2px 20px rgba(40,20,60,.6)}
  .title .poem{font-family:var(--kai);font-size:12px;color:rgba(255,246,232,.92);margin-top:10px;line-height:2;letter-spacing:1px;text-shadow:0 1px 12px rgba(40,20,60,.6)}
  .title .poem b{color:var(--gold-l)}
  .arrival{position:absolute;bottom:10px;left:0;right:0;text-align:center;z-index:12;font-size:11px;color:rgba(255,244,224,.9);letter-spacing:2px;text-shadow:0 1px 10px rgba(40,20,60,.6);animation:tw 3.6s ease-in-out infinite}

  .vignette{position:absolute;inset:0;z-index:20;pointer-events:none;background:radial-gradient(120% 105% at 50% 40%,transparent 46%,rgba(10,6,30,.55) 100%)}
  .fg-spore{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,240,200,.5),transparent 70%);z-index:15;pointer-events:none;animation:fgdrift 14s ease-in-out infinite}
  @keyframes fgdrift{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-24px);opacity:.8}}
</style>
</head>
<body>
<div class="stage">
  <!-- 天空 -->
  <div class="sky">
    <span class="star" style="left:8%;top:9%"></span>
    <span class="star" style="left:25%;top:6%"></span>
    <span class="star s-big" style="left:42%;top:14%"></span>
    <span class="star" style="left:58%;top:8%"></span>
    <span class="star s-big" style="left:76%;top:16%"></span>
    <span class="star" style="left:90%;top:9%"></span>
    <span class="star" style="left:16%;top:32%"></span>
    <span class="star" style="left:66%;top:36%"></span>
    <div class="nebula n1"></div><div class="nebula n2"></div>
    <div class="aplanet ap1"></div><div class="aplanet ap2"></div>
    <div class="cloud cl1"></div><div class="cloud cl2"></div>
    <div class="skyarch gate"><div class="g-f"></div><div class="g-p"></div></div>
    <div class="skyarch council">
      <div class="cf-halo"></div><div class="cf-table"></div><div class="cf-core"></div>
      <div class="cf-tiers"><div class="cf-tier cf-t1"></div><div class="cf-tier cf-t2"></div><div class="cf-tier cf-t3"></div></div>
    </div>
  </div>

  <!-- 地平线 + 地面 -->
  <div class="horizon"></div>
  <div class="ground"></div>

  <!-- 中央·生命核心广场 -->
  <div class="plaza">
    <div class="pz-floor"></div>
    <div class="pz-ring"></div><div class="pz-ring2"></div>
    <div class="pz-pillar pl1"></div><div class="pz-pillar pl2"></div>
    <div class="pz-core"></div>
    <div class="pz-beam"></div>
  </div>

  <!-- 六条光路 -->
