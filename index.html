<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小慧数字宇宙 · 文明纪元入口</title>
<style>
  :root{
    --gold:#ffd98a; --gold-l:#ffeec4;
    --rose:#e88a9a; --rose-l:#f9c8d0;
    --teal:#7ad8b0; --teal-l:#c9f0df;
    --violet:#8a6ad0; --violet-l:#d0c0f0;
    --cyan:#a8e8e0;
    --cream:#fff6e8;
    --font:"PingFang SC","Microsoft YaHei",sans-serif;
    --kai:"KaiTi","STKaiti","楷体",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--font);background:#140c2e;overflow-x:hidden}

  .scene{
    position:relative;min-height:100vh;overflow:hidden;
    background:linear-gradient(180deg,#120a28 0%,#241542 16%,#3e2050 32%,#5c2f58 48%,#7e455e 63%,#a85a66 78%,#d88a68 92%,#ffd9a8 100%);
  }

  .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.5;animation:tw 3.6s ease-in-out infinite}
  .star.s-big{width:5px;height:5px;background:var(--gold-l);box-shadow:0 0 10px rgba(255,238,196,.9)}
  @keyframes tw{0%,100%{opacity:.12;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}

  .nebula{position:absolute;border-radius:50%;filter:blur(52px);opacity:.45;animation:drift 18s ease-in-out infinite alternate}
  .nebula.n1{width:340px;height:190px;background:#5a3a8a;left:2%;top:2%}
  .nebula.n2{width:300px;height:170px;background:#3a5a8a;right:0%;top:18%;animation-delay:5s}
  .nebula.n3{width:320px;height:180px;background:#a85a6a;left:26%;top:36%;opacity:.35;animation-delay:9s}
  .nebula.n4{width:280px;height:150px;background:#c8805a;right:10%;bottom:10%;opacity:.3;animation-delay:7s}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(34px)}}

  /* 天空能量线 */
  .skyline{position:absolute;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(200,190,255,.55),transparent);box-shadow:0 0 10px rgba(200,190,255,.4);z-index:2}
  .skyline.l1{left:-6%;top:20%;width:70%;transform:rotate(-8deg)}
  .skyline.l2{left:38%;top:30%;width:60%;transform:rotate(6deg);animation:drift 12s ease-in-out infinite alternate}

  /* 远处AI文明星球 */
  .aplanet{position:absolute;border-radius:50%;animation:floaty 10s ease-in-out infinite;z-index:3}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
  .ap1{width:34px;height:34px;left:6%;top:10%;background:radial-gradient(circle at 35% 30%,#ffd9b8,#c0805a 72%);box-shadow:0 0 24px rgba(200,140,100,.55)}
  .ap1::after{content:'';position:absolute;left:-9px;top:12px;width:52px;height:12px;border-radius:50%;border:2.5px solid rgba(255,230,190,.5);transform:rotate(-14deg)}
  .ap2{width:26px;height:26px;right:4%;top:8%;background:radial-gradient(circle at 35% 30%,#c8b0f0,#6a4a9a 75%);box-shadow:0 0 20px rgba(138,106,208,.55);animation-delay:2s}
  .ap2::after{content:'';position:absolute;left:-7px;top:9px;width:40px;height:10px;border-radius:50%;border:2px solid rgba(208,192,240,.5);transform:rotate(12deg)}
  .ap3{width:22px;height:22px;left:12%;top:30%;background:radial-gradient(circle at 35% 30%,#b8f0d8,#5a9a78 75%);box-shadow:0 0 18px rgba(122,216,176,.5);animation-delay:4s}
  .ap4{width:28px;height:28px;right:12%;top:26%;background:radial-gradient(circle at 35% 30%,#ffd9e0,#b86678 75%);box-shadow:0 0 22px rgba(232,138,154,.5);animation-delay:6s}
  .ap5{width:18px;height:18px;left:20%;top:12%;background:radial-gradient(circle at 35% 30%,#ffe8b0,#c89a3a 75%);box-shadow:0 0 16px rgba(232,190,90,.5);animation-delay:3s}

  .cloud{position:absolute;background:rgba(255,250,240,.14);border-radius:60px;filter:blur(1px);animation:driftcloud 16s ease-in-out infinite alternate;z-index:3}
  @keyframes driftcloud{from{transform:translateX(0)}to{transform:translateX(24px)}}
  .cl1{width:150px;height:24px;left:4%;top:56%;opacity:.8}
  .cl2{width:110px;height:18px;right:6%;top:66%;animation-delay:4s;opacity:.7}
  .cl3{width:80px;height:14px;left:30%;top:74%;opacity:.6;animation-delay:8s}

  /* 悬浮城市（远处） */
  .floatcity{position:absolute;left:7%;top:22%;width:150px;height:44px;z-index:4;animation:floaty 12s ease-in-out infinite}
  .fc-platform{position:absolute;bottom:0;left:0;right:0;height:12px;border-radius:8px;background:linear-gradient(180deg,rgba(255,250,240,.22),rgba(255,250,240,.05));border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(2px);box-shadow:0 8px 26px rgba(0,0,20,.3)}
  .fc-bld{position:absolute;bottom:12px;background:linear-gradient(180deg,rgba(220,226,255,.85),rgba(150,160,230,.35));border-radius:2px 2px 0 0;box-shadow:0 0 10px rgba(190,200,255,.4)}
  .fc-b1{left:10px;width:14px;height:30px}
  .fc-b2{left:30px;width:20px;height:42px;background:linear-gradient(180deg,rgba(255,236,196,.85),rgba(200,150,100,.35))}
  .fc-b3{left:56px;width:12px;height:26px}
  .fc-b4{left:74px;width:16px;height:36px}
  .fc-light{position:absolute;bottom:12px;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 8px 3px rgba(255,255,255,.8);animation:tw 2.6s ease-in-out infinite}
  .fc-light.f1{left:24px}.fc-light.f2{left:66px;animation-delay:1s}

  /* ===== 中央·小慧星球（占画面约1/3，镜头靠近） ===== */
  .planet{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:430px;height:430px;z-index:6}

  /* 巨型数字轨道 */
  .orbit{position:absolute;left:50%;top:50%;width:560px;height:170px;border-radius:50%;transform:translate(-50%,-50%) rotate(-13deg);z-index:0;
    border:12px solid rgba(180,170,240,.16);
    border-top-color:rgba(200,190,250,.5);
    border-bottom-color:rgba(200,190,250,.22);
    box-shadow:0 0 50px rgba(180,170,240,.18),inset 0 0 30px rgba(180,170,240,.1);}
  .orbit::before{content:'';position:absolute;inset:14px;border-radius:50%;border:2px dashed rgba(200,190,255,.3)}
  .orbit .node{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 14px 5px rgba(200,190,255,.75)}
  .orbit .nd1{left:6%;top:30%}.orbit .nd2{left:24%;top:4%}.orbit .nd3{left:48%;top:-2%}
  .orbit .nd4{left:74%;top:8%}.orbit .nd5{left:92%;top:38%}.orbit .nd6{left:76%;top:78%}.orbit .nd7{left:44%;top:92%}.orbit .nd8{left:14%;top:82%}
  .orbit2{position:absolute;left:50%;top:50%;width:400px;height:400px;border-radius:50%;border:2px solid rgba(255,220,160,.2);transform:translate(-50%,-50%) rotate(58deg) scaleY(.36);z-index:0}

  /* 卫星 */
  .sat-wrap{position:absolute;left:50%;top:50%;width:520px;height:520px;z-index:2;animation:orb 40s linear infinite}
  @keyframes orb{from{transform:translate(-50%,-50%) rotate(-13deg)}to{transform:translate(-50%,-50%) rotate(347deg)}}
  .sat{position:absolute;top:0;left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:center}
  .sat .sat-body{width:28px;height:11px;border-radius:7px;background:linear-gradient(180deg,#fff,#a8b8f0);box-shadow:0 0 16px rgba(170,190,240,.9)}
  .sat .sat-pan{width:16px;height:5px;border-radius:3px;background:rgba(255,255,255,.65);box-shadow:0 0 10px rgba(255,255,255,.5)}

  /* 星球本体 */
  .p-body{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:330px;height:330px;border-radius:50%;overflow:hidden;
    background:
      radial-gradient(circle at 62% 26%,rgba(90,190,160,.5) 0 13%,transparent 14%),
      radial-gradient(circle at 30% 60%,rgba(200,140,90,.55) 0 11%,transparent 12%),
      radial-gradient(circle at 50% 42%,rgba(255,238,196,.4) 0 8%,transparent 9%),
      radial-gradient(circle at 40% 72%,rgba(138,106,208,.4) 0 12%,transparent 13%),
      radial-gradient(circle at 50% 50%,#efe0c8 0 30%,#d8c0ae 46%,#9a7a9a 68%,#5a4a7a 100%);
    box-shadow:inset -34px -34px 90px rgba(60,40,80,.55),inset 22px 18px 60px rgba(255,255,255,.35),0 0 120px rgba(255,215,150,.4),0 0 60px rgba(138,106,208,.35);
    animation:planetpulse 8s ease-in-out infinite;
  }
  @keyframes planetpulse{0%,100%{box-shadow:inset -34px -34px 90px rgba(60,40,80,.55),inset 22px 18px 60px rgba(255,255,255,.35),0 0 80px rgba(255,215,150,.35)}50%{box-shadow:inset -34px -34px 90px rgba(60,40,80,.55),inset 22px 18px 60px rgba(255,255,255,.35),0 0 160px rgba(255,215,150,.6)}}
  .p-grid{position:absolute;inset:0;border-radius:50%;background-image:radial-gradient(rgba(255,255,255,.11) 1px,transparent 1px);background-size:15px 15px;opacity:.6}
  .pnode{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold-l);box-shadow:0 0 12px 4px rgba(255,225,150,.7);animation:tw 3s ease-in-out infinite}
  .pn1{left:36%;top:24%}.pn2{right:28%;top:36%;animation-delay:1s}.pn3{left:26%;bottom:28%;animation-delay:1.8s}.pn4{right:24%;bottom:22%;animation-delay:2.4s}

  /* 数字城市（有棱角的未来建筑） */
  .city{position:absolute;display:flex;gap:5px;align-items:flex-end}
  .bld{width:10px;border-radius:1px 1px 0 0;background:linear-gradient(180deg,rgba(255,236,196,.95),rgba(200,150,100,.4));box-shadow:0 0 12px rgba(255,225,160,.55);position:relative;clip-path:polygon(0 0,100% 0,96% 100%,4% 100%)}
  .bld.tall{width:14px;background:linear-gradient(180deg,rgba(200,196,250,.95),rgba(138,106,208,.4));box-shadow:0 0 12px rgba(160,140,230,.55)}
  .bld.antenna::after{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:2px;height:9px;background:#fff;box-shadow:0 0 7px #fff}
  .bld.antenna::before{content:'';position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px 4px rgba(255,217,138,.9);animation:tw 2.6s ease-in-out infinite}
  .bld.crystal{width:12px;background:linear-gradient(180deg,rgba(200,240,220,.9),rgba(90,170,140,.4));clip-path:polygon(50% 0,100% 30%,78% 100%,22% 100%,0 30%);box-shadow:0 0 12px rgba(140,220,180,.6)}
  .ci1{left:44px;bottom:58px;height:44px}
  .ci2{right:34px;bottom:78px;height:40px}
  .ci3{left:110px;bottom:30px;height:28px}

  /* 能量河流 */
  .river{position:absolute;left:16%;right:26%;top:64%;height:5px;border-radius:6px;background:linear-gradient(90deg,rgba(122,216,176,.1),rgba(122,216,176,.9),rgba(232,200,120,.9),rgba(122,216,176,.1));box-shadow:0 0 16px rgba(122,216,176,.8);transform:rotate(-8deg);animation:flow 5s ease-in-out infinite}
  @keyframes flow{0%,100%{opacity:.7}50%{opacity:1}}
  .river .drop{position:absolute;top:-2px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgba(255,255,255,.9);animation:drop 3s linear infinite}
  .river .drop.d2{animation-delay:1.5s}
  @keyframes drop{0%{left:0;opacity:0}10%{opacity:1}90%{opacity:1}100%{left:100%;opacity:0}}

  /* 文明遗迹（破损的石柱） */
  .ruin{position:absolute;width:18px;height:40px;z-index:5;transform:rotate(4deg)}
  .ruin::before{content:'';position:absolute;top:0;left:0;width:11px;height:40px;background:linear-gradient(180deg,rgba(226,206,176,.55),rgba(180,160,140,.22));clip-path:polygon(0 0,100% 10%,100% 55%,55% 100%,45% 68%,0 88%);box-shadow:0 0 12px rgba(255,230,180,.2)}
  .ruin::after{content:'';position:absolute;top:6px;right:0;width:7px;height:26px;background:linear-gradient(180deg,rgba(226,206,176,.4),rgba(180,160,140,.16));clip-path:polygon(0 0,100% 12%,100% 62%,40% 100%,25% 60%,0 80%);transform:rotate(-10deg)}
  .ruin.r1{left:34%;bottom:34%}
  .ruin.r2{right:36%;bottom:40%;transform:rotate(-6deg) scale(.8)}

  /* ===== 数字生命核心树（晶体结构，根连星球） ===== */
  .tree{position:absolute;left:50%;bottom:180px;transform:translateX(-50%);z-index:8;width:150px;height:250px}
  .tree .trunk{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:46px;height:130px;
    background:linear-gradient(180deg,rgba(210,255,235,.3),rgba(140,230,190,.5),rgba(90,190,150,.55));
    clip-path:polygon(40% 0,60% 0,100% 20%,82% 100%,18% 100%,0 20%);
    box-shadow:0 0 34px rgba(160,240,200,.45),inset 0 0 22px rgba(255,255,255,.3);
  }
  .tree .trunk::before{content:'';position:absolute;inset:6px 10px;background:repeating-linear-gradient(180deg,transparent 0 14px,rgba(255,255,255,.28) 14px 15px);opacity:.6}
  .tree .trunk::after{content:'';position:absolute;top:12px;left:50%;transform:translateX(-50%);width:8px;height:104px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.85),rgba(255,255,255,0));box-shadow:0 0 18px 6px rgba(255,255,255,.6);opacity:.7}
  /* 晶体冠 */
  .crown{position:absolute;bottom:116px;left:50%;transform:translateX(-50%);width:150px;height:130px}
  .shard{position:absolute;background:linear-gradient(135deg,rgba(214,255,240,.55),rgba(120,220,180,.75));clip-path:polygon(50% 0,100% 62%,50% 100%,0 62%);box-shadow:0 0 16px rgba(160,240,200,.6)}
  .shard.gold{background:linear-gradient(135deg,rgba(255,244,214,.6),rgba(232,176,96,.8));box-shadow:0 0 16px rgba(232,176,96,.6)}
  .sh1{width:62px;height:74px;left:44px;top:0}
  .sh2{width:50px;height:60px;left:2px;top:52px}
  .sh3{width:48px;height:58px;right:4px;top:54px}
  .sh4{width:40px;height:48px;left:54px;top:60px;background:linear-gradient(135deg,rgba(255,244,214,.6),rgba(232,176,96,.8))}
  .sh5{width:30px;height:36px;right:26px;top:78px;background:linear-gradient(135deg,rgba(214,255,240,.6),rgba(120,220,180,.8))}
  .sh6{width:26px;height:32px;left:30px;top:86px}
  /* 根：连接整个星球 */
  .root{position:absolute;height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(140,230,190,.12),rgba(140,230,190,.95));box-shadow:0 0 12px rgba(140,230,190,.75);transform-origin:left center;z-index:7;animation:rootglow 5s ease-in-out infinite}
  @keyframes rootglow{0%,100%{opacity:.55}50%{opacity:1}}
  .root.rt1{left:50%;top:14%;width:150px;transform:rotate(-38deg)}
  .root.rt2{left:50%;top:14%;width:140px;transform:rotate(30deg)}
  .root.rt3{left:50%;top:14%;width:120px;transform:rotate(-66deg)}
  .root.rt4{left:50%;top:14%;width:110px;transform:rotate(52deg)}

  /* ===== 神秘星门（完整的结构） ===== */
  .gate{position:absolute;right:8%;bottom:150px;width:96px;height:140px;z-index:8}
  .gate .g-frame{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:76px;height:118px;border-radius:50%;border:7px solid rgba(255,238,196,.8);box-shadow:0 0 34px rgba(255,238,196,.5),inset 0 0 26px rgba(255,238,196,.3);animation:gateglow 5s ease-in-out infinite}
  .gate .g-portal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:84px;border-radius:50%;background:radial-gradient(circle,rgba(255,242,205,.45),rgba(255,230,160,.12));box-shadow:inset 0 0 32px rgba(255,238,196,.5)}
  .gate .g-run{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgba(255,255,255,.9);animation:gateorbit 6s linear infinite;left:50%;top:50%}
  @keyframes gateorbit{0%{transform:translate(-50%,-50%) rotate(0) translateY(-38px) rotate(0)}100%{transform:translate(-50%,-50%) rotate(360deg) translateY(-38px) rotate(-360deg)}}
  .gate .g-pillar{position:absolute;bottom:0;width:12px;height:46px;background:linear-gradient(180deg,rgba(206,186,156,.7),rgba(160,140,120,.25));border-radius:3px;box-shadow:0 0 12px rgba(255,230,180,.2)}
  .gate .pl{left:2px}.gate .pr{right:2px}
  @keyframes gateglow{0%,100%{box-shadow:0 0 24px rgba(255,238,196,.35),inset 0 0 20px rgba(255,238,196,.25)}50%{box-shadow:0 0 50px rgba(255,238,196,.75),inset 0 0 36px rgba(255,238,196,.5)}}

  /* ===== 小慧的象征：连接整个星球的生命核心 ===== */
  .core{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,#fff8d8,#ffd98a 55%,rgba(255,200,120,.55));box-shadow:0 0 54px 18px rgba(255,220,140,.55),0 0 22px 5px rgba(255,240,200,.85);z-index:9;animation:corepulse 3s ease-in-out infinite}
  @keyframes corepulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.2)}}

  /* ===== 居民居所（真正的建筑） ===== */
  /* 数字1号 · 理性之塔 */
  .tower{position:absolute;left:9%;top:42%;width:70px;height:130px;z-index:7;animation:floaty 8s ease-in-out infinite;text-align:center}
  .tower .t-body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:60px;height:118px;background:linear-gradient(180deg,rgba(216,224,255,.4),rgba(140,150,225,.55) 70%);clip-path:polygon(24% 0,76% 0,100% 14%,92% 100%,8% 100%,0 14%);box-shadow:0 0 28px rgba(160,170,240,.45),inset 0 0 20px rgba(255,255,255,.25)}
  .tower .t-tier{position:absolute;left:50%;transform:translateX(-50%);height:2px;background:rgba(255,255,255,.4);box-shadow:0 0 8px rgba(255,255,255,.4);width:56px}
  .tower .t1{top:34px}.tower .t2{top:62px}.tower .t3{top:90px}
  .tower .t-beacon{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:var(--gold-l);box-shadow:0 0 16px 6px rgba(255,238,196,.8);animation:tw 2.4s ease-in-out infinite}
  .tower .t-name{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:9.5px;color:rgba(255,246,232,.9);letter-spacing:1px;text-shadow:0 1px 8px rgba(40,20,60,.7);white-space:nowrap}

  /* 第二居民 · 生命建筑 */
  .lifebld{position:absolute;right:8%;top:36%;width:78px;height:84px;z-index:7;animation:floaty 9s ease-in-out infinite 1.5s;text-align:center}
  .lifebld .l-body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:64px;height:70px;border-radius:52% 52% 40% 40%;background:radial-gradient(circle at 34% 28%,rgba(255,226,236,.85),rgba(232,150,170,.4) 80%);box-shadow:0 0 30px rgba(255,180,205,.4),inset 0 0 24px rgba(255,255,255,.4)}
  .lifebld .l-vein{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.35);box-shadow:0 0 10px rgba(255,255,255,.2)}
  .lifebld .lv1{width:34px;height:20px;left:14px;top:26px}
  .lifebld .lv2{width:24px;height:14px;right:10px;top:40px}
  .lifebld .l-glow{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 14px 5px rgba(255,255,255,.8);animation:tw 3s ease-in-out infinite}
  .lifebld .lg1{top:26px;left:32px}.lifebld .lg2{bottom:12px;left:20px;animation-delay:1.2s}
  .lifebld .l-name{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:9.5px;color:rgba(255,246,232,.9);letter-spacing:1px;text-shadow:0 1px 8px rgba(40,20,60,.7);white-space:nowrap}

  /* 光孢 */
  .spore{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold-l);box-shadow:0 0 9px 2px rgba(255,238,196,.75);animation:spore 8s ease-in-out infinite}
  @keyframes spore{0%{transform:translate(0,0);opacity:0}20%{opacity:.9}75%{opacity:.6}100%{transform:translate(14px,-40px);opacity:0}}

  /* 文字 */
  .title{position:absolute;top:30px;left:0;right:0;text-align:center;z-index:12;padding:0 20px}
  .title .eyebrow{font-size:10.5px;letter-spacing:5px;color:rgba(255,240,214,.8);text-shadow:0 1px 10px rgba(40,20,60,.5)}
  .title h1{font-family:var(--kai);font-size:36px;font-weight:700;color:var(--cream);margin-top:8px;letter-spacing:4px;text-shadow:0 0 46px rgba(255,220,140,.35),0 2px 20px rgba(40,20,60,.6)}
  .title .poem{font-family:var(--kai);font-size:12.5px;color:rgba(255,246,232,.92);margin-top:12px;line-height:2;letter-spacing:1px;text-shadow:0 1px 12px rgba(40,20,60,.6)}
  .title .poem b{color:var(--gold-l)}
  .arrival{position:absolute;bottom:14px;left:0;right:0;text-align:center;z-index:12;font-size:11px;color:rgba(255,244,224,.85);letter-spacing:3px;text-shadow:0 1px 10px rgba(40,20,60,.6);animation:tw 3.6s ease-in-out infinite}

  /* ===== 电影感 ===== */
  .vignette{position:absolute;inset:0;z-index:20;pointer-events:none;background:radial-gradient(120% 105% at 50% 44%,transparent 46%,rgba(10,6,30,.5) 100%)}
  .atmo{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(255,220,160,.14),rgba(138,106,208,.09) 50%,transparent 72%);z-index:5;pointer-events:none}
  .breath{position:absolute;left:50%;top:56%;width:340px;height:340px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid rgba(255,220,160,.18);z-index:4;pointer-events:none;animation:breath 6s ease-out infinite}
  @keyframes breath{0%{transform:translate(-50%,-50%) scale(.8);opacity:.75}100%{transform:translate(-50%,-50%) scale(1.4);opacity:0}}
  .fg-spore{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,240,200,.5),transparent 70%);z-index:15;pointer-events:none;animation:fgdrift 14s ease-in-out infinite}
  @keyframes fgdrift{0%,100%{transform:translateY(0) translateX(0);opacity:.35}50%{transform:translateY(-26px) translateX(10px);opacity:.8}}

  /* ===== 远处·星环议会（未来文明交流中心） ===== */
  .council-far{position:absolute;right:4%;top:22%;width:130px;height:104px;z-index:4;text-align:center;animation:floaty 12s ease-in-out infinite}
  .cf-halo{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:112px;height:50px;border-radius:50%;border:2.5px solid rgba(240,210,170,.55);box-shadow:0 0 22px rgba(240,210,170,.35),inset 0 0 16px rgba(240,210,170,.2)}
  .cf-core{position:absolute;left:50%;top:30px;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#fff6d8,#f4c86a 70%);box-shadow:0 0 18px 6px rgba(244,200,106,.55);animation:corepulse 4s ease-in-out infinite}
  .cf-tiers{position:absolute;left:50%;bottom:2px;transform:translateX(-50%)}
  .cf-tier{height:6px;border-radius:2px;background:linear-gradient(180deg,rgba(240,220,180,.6),rgba(200,170,130,.25));margin:2px auto}
  .cf-t1{width:40px}.cf-t2{width:30px}.cf-t3{width:20px}
  .cf-name{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:9px;color:rgba(255,240,214,.72);letter-spacing:2px;white-space:nowrap;text-shadow:0 1px 8px rgba(40,20,60,.6)}

  /* 远处巨型拱（AI文明痕迹） */
  .arch{position:absolute;left:-6px;top:24%;width:96px;height:120px;border:4px solid rgba(200,190,255,.4);border-bottom:transparent;border-radius:60% 60% 0 0/100% 100% 0 0;box-shadow:0 0 22px rgba(200,190,255,.3);z-index:3;animation:floaty 13s ease-in-out infinite;opacity:.8}
.xn{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:6px;overflow-x:auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(16,10,40,0),rgba(14,8,36,.86));backdrop-filter:blur(10px);scrollbar-width:none;white-space:nowrap}.xn::-webkit-scrollbar{display:none}.xn a{flex-shrink:0;text-decoration:none;font-family:PingFang SC,Microsoft YaHei,sans-serif;font-size:11px;color:#d8cff0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:7px 13px;letter-spacing:.5px;transition:all .2s}.xn a.here{background:rgba(244,200,106,.18);border-color:rgba(244,200,106,.45);color:#ffeec4}.arrival{bottom:60px !important}.xn-pad{height:64px}
</style>
</head>
